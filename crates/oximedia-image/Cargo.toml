[package]
name = "oximedia-image"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Professional image sequence I/O for OxiMedia (DPX, OpenEXR, TIFF)"
keywords = ["image", "multimedia", "processing", "pixels", "graphics"]
categories = ["multimedia::images", "multimedia"]
readme = "README.md"

[lints]
workspace = true

[dependencies]
oximedia-core.workspace = true
thiserror.workspace = true
bytes.workspace = true

# Image format dependencies
byteorder.workspace = true
half = "2.7"
# NOTE: no external `tiff` crate here -- `src/tiff/` is an in-house TIFF/BigTIFF
# implementation built on `byteorder`, `weezl` and `oxiarc-deflate`. The unused
# `tiff = "0.11"` dependency that used to sit on this line only dragged
# flate2 + miniz_oxide into the graph (COOLJAPAN Policy: use oxiarc-*).
serde = { workspace = true }

# Compression support
oxiarc-deflate = { workspace = true }  # Pure Rust DEFLATE (COOLJAPAN Policy)
oxiarc-lz4 = { workspace = true }     # Pure Rust LZ4 (COOLJAPAN Policy)
weezl = "0.2"  # LZW compression

memmap2.workspace = true
oxifft.workspace = true

[dev-dependencies]
tempfile.workspace = true

# Thread-backed dependencies, kept off `wasm32-unknown-unknown`:
#
# - oxifft's `threading` (rayon) backend is a hard `compile_error!` on wasm32,
#   so the workspace baseline is `std` only; restore it for native targets.
# - rayon itself compiles on wasm32 but cannot spawn its worker pool there, so
#   every `par_iter` would fail at run time. `src/parallel.rs` routes the
#   crate's parallel loops through helpers that fall back to sequential
#   iteration when this dependency is absent.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
oxifft = { workspace = true, features = ["threading"] }
rayon = { workspace = true }
