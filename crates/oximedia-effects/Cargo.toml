[package]
name = "oximedia-effects"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Professional audio effects suite for OxiMedia"
keywords = ["audio", "effects", "reverb", "dsp", "multimedia"]
categories = ["multimedia::audio", "multimedia"]
readme = "README.md"

[lints]
workspace = true

[dependencies]
oximedia-core.workspace = true
oximedia-audio.workspace = true
thiserror.workspace = true
oxifft = { workspace = true }
scirs2-core = { workspace = true }
fundsp = { workspace = true, optional = true }

[features]
fundsp = ["dep:fundsp"]

[dev-dependencies]

# oxifft's `threading` (rayon) backend is a hard `compile_error!` on wasm32, so
# the workspace baseline is `std` only; restore it for native targets.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
oxifft = { workspace = true, features = ["threading"] }
