[package]
name = "oximedia-restore"
description = "Media restoration tools for damaged or degraded content"
keywords = ["restoration", "denoising", "video", "multimedia", "quality"]
categories = ["multimedia::video", "multimedia"]
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true
readme = "README.md"

[lints]
workspace = true

[dependencies]
oximedia-core = { workspace = true }
oximedia-audio = { workspace = true }
thiserror = { workspace = true }
oxifft = { workspace = true }
rayon = { workspace = true }

[dev-dependencies]
rand = { workspace = true }

# oxifft's `threading` (rayon) backend is a hard `compile_error!` on wasm32, so
# the workspace baseline is `std` only; restore it for native targets.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
oxifft = { workspace = true, features = ["threading"] }
