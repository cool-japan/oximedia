[package]
name = "oximedia-spatial"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Spatial audio processing for OxiMedia — Ambisonics, binaural rendering, and room acoustics simulation"
readme = "README.md"
keywords = ["spatial-audio", "ambisonics", "binaural", "hrtf", "room-acoustics"]
categories = ["multimedia::audio", "science"]

[lints]
workspace = true

[dependencies]
thiserror.workspace = true
oxifft.workspace = true
rayon.workspace = true

[dev-dependencies]

# oxifft's `threading` (rayon) backend is a hard `compile_error!` on wasm32, so
# the workspace baseline is `std` only; restore it for native targets.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
oxifft = { workspace = true, features = ["threading"] }
