[package]
name = "oximedia-normalize"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
description = "Broadcast loudness normalization: EBU R128, ATSC A/85, streaming platforms, ReplayGain"
readme = "README.md"
keywords = ["audio", "normalization", "loudness", "broadcast", "ebu-r128"]
categories = ["multimedia::audio", "multimedia::encoding"]

[dependencies]
oximedia-core = { workspace = true }
oximedia-audio = { workspace = true }
oximedia-codec = { workspace = true }
oximedia-metering = { workspace = true }
oximedia-metadata = { workspace = true }
oxifft = { workspace = true }
rayon = { workspace = true }
thiserror = { workspace = true }

[lints]
workspace = true

# oxifft's `threading` (rayon) backend is a hard `compile_error!` on wasm32, so
# the workspace baseline is `std` only; restore it for native targets.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
oxifft = { workspace = true, features = ["threading"] }
