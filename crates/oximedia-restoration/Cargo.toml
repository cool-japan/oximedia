[package]
name = "oximedia-restoration"
description = "Image restoration algorithms for OxiMedia: blind deconvolution and content-aware inpainting"
keywords = ["restoration", "deconvolution", "inpainting", "image", "patchmatch"]
categories = ["multimedia::images", "multimedia"]
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true
readme = "README.md"
[lints]
workspace = true

[dependencies]
oximedia-core = { workspace = true }
thiserror = { workspace = true }
rayon = { workspace = true }
oxifft = { workspace = true }
rand = { workspace = true }

[dev-dependencies]

# oxifft's `threading` (rayon) backend is a hard `compile_error!` on wasm32, so
# the workspace baseline is `std` only; restore it for native targets.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
oxifft = { workspace = true, features = ["threading"] }
